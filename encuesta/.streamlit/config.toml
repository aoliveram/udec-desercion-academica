[server]
headless = true
address = "127.0.0.1"
# Re-run the app when a source file is saved, so edits to instrumento.py
# show up in the open browser tab. Session state (and so a respondent's
# position and answers) survives a rerun either way.
runOnSave = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# Hides Streamlit's developer menu (Deploy, Rerun, settings) from respondents.
toolbarMode = "minimal"
